<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kabutomushi Keeper has moved</title>
<meta name="robots" content="noindex">
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; background: #0e1411; color: #edf2e7; font: 17px/1.5 ui-rounded, system-ui, sans-serif; text-align: center; }
  a { color: #f3aa3c; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Kabutomushi Keeper has moved</h1>
  <p>It now has its own address:<br><a id="go" href="https://gerritius.github.io/kabutomushi/">gerritius.github.io/kabutomushi</a></p>
  <p>Your data comes with it. Add the new address to your Home Screen.</p>
</main>
<script>
  // Switch off the old offline copy that lived here, then forward to the new address.
  (async () => {
    try {
      if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) if (new URL(r.scope).pathname.startsWith('/garden-planner/kabutomushi/')) await r.unregister();
      if ('caches' in window) for (const k of await caches.keys()) if (k.startsWith('kabutomushi-v1') || k === 'kabutomushi-v2') await caches.delete(k);
    } catch (e) {}
    location.replace('https://gerritius.github.io/kabutomushi/');
  })();
</script>
</body>
</html>
