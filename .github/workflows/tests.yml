# Lints the app's modules and runs the scenario tests for work on other branches and pull requests. (Pushes to main and
# test are checked the same way by the Deploy workflow, before they go live.) The result shows as ✓ / ✗ on GitHub.
name: Tests
on:
  push:
    branches-ignore: [main, test]
  pull_request:
  workflow_dispatch:
jobs:
  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - name: Lint (a name used without importing it, unused code)
        run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Keep the test output if something failed
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-output
          path: tests/output
          retention-days: 7
